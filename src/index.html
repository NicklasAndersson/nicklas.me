<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicklas Andersson</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #333;
            background-color: #fff;
            line-height: 1.6;
        }

        a {
            color: #333;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            margin-bottom: 50px;
            text-align: center;
        }

        .profile-photo {
            width: 200px;
            height: 200px;
            border-radius: 10%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .contact-info {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        .summary {
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .employer-block {
            margin-bottom: 30px;
        }

        .employer-header {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .employer-period {
            font-weight: normal;
            color: #666;
        }

        .assignment {
            margin-bottom: 15px;
            padding-left: 20px;
        }

        .assignment-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .technologies {
            color: #555;
            font-size: 0.95rem;
        }

        .education-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!--APP-->
</body>
</html>
